name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 08:00 UTC — prevents Supabase free tier from pausing
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/services?select=id&limit=1")

          echo "Supabase ping status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Ping failed with status $STATUS"
            exit 1
          fi

          echo "✅ Supabase is alive!"
